<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>湊孖女翻譯神器</title>

  <!-- 引入 PWA 設定檔 -->
  <link rel="manifest" href="manifest.json">

  <!-- 手機系統設定 -->
  <meta name="apple-mobile-web-app-title" content="湊孖女神器">
  <meta name="application-name" content="湊孖女神器">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ff80ab">

  <!-- 桌面雙胞胎 BB + 雙奶樽 Icon (保證彩色唔會灰色) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23ff80ab'/><text y='45' x='10' font-size='38'>👶👶</text><text y='85' x='18' font-size='35'>🍼🍼</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23ff80ab'/><text y='45' x='10' font-size='38'>👶👶</text><text y='85' x='18' font-size='35'>🍼🍼</text></svg>">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", sans-serif;
      background: #14171a;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      user-select: none;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 6px 0;
    }
    .twins-avatar {
      font-size: 32px;
      line-height: 1;
    }
    .app-title {
      font-size: 24px;
      font-weight: 900;
      color: #ff80ab;
      letter-spacing: 1px;
    }

    #status {
      text-align: center;
      font-size: 17px;
      color: #b0bec5;
      font-weight: bold;
      min-height: 24px;
    }

    #display-box {
      flex: 1;
      background: #21262d;
      border: 3px solid #374151;
      border-radius: 22px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 10px;
    }
    .text-original { font-size: 19px; color: #9e9e9e; }
    .text-main { font-size: 28px; font-weight: bold; color: #00e676; line-height: 1.35; }
    .text-sub { font-size: 21px; color: #ffd54f; line-height: 1.35; }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .giant-btn {
      width: 100%;
      height: 115px;
      border: none;
      border-radius: 22px;
      font-size: 27px;
      font-weight: 900;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
      cursor: pointer;
    }
    .giant-btn:active { transform: scale(0.96); opacity: 0.92; }
    .btn-subtext { font-size: 16px; font-weight: 500; margin-top: 4px; opacity: 0.9; }

    .btn-master {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      border-bottom: 4px solid #144417;
    }
    .btn-worker {
      background: linear-gradient(135deg, #1565c0, #0d47a1);
      border-bottom: 4px solid #082d64;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <span class="twins-avatar">👶👶🍼🍼</span>
    <span class="app-title">湊孖女翻譯神器</span>
  </div>

  <div id="status">準備就緒，點擊下方大掣講嘢</div>

  <div id="display-box">
    <div style="font-size: 22px; font-weight: bold; color: #e0e0e0;">點擊下方按鈕開始</div>
    <div style="font-size: 17px; color: #4caf50; font-weight: bold; margin-top: 8px;">🟢 綠掣：師傅講 (自動譯英文+菲語)</div>
    <div style="font-size: 17px; color: #42a5f5; font-weight: bold;">🔵 藍掣：姐姐講 (自動譯廣東話)</div>
  </div>

  <div class="btn-container">
    <button class="giant-btn btn-master" onclick="handleMaster()">
      🟢 師傅講嘢 (我講)
      <span class="btn-subtext">講廣東話 ➔ 自動讀出英文+菲語</span>
    </button>

    <button class="giant-btn btn-worker" onclick="handleWorker()">
      🔵 姐姐講嘢 (佢講)
      <span class="btn-subtext">Worker speaks ➔ 自動讀出廣東話</span>
    </button>
  </div>

  <script>
    const WORKER_URL = "https://wandering-haze-33cdbb-translator.stream-hub-th.workers.dev";

    const statusDiv = document.getElementById('status');
    const displayBox = document.getElementById('display-box');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null;

    if (SpeechRecognition) {
      recognizer = new SpeechRecognition();
      recognizer.continuous = false;
      recognizer.interimResults = false;
    } else {
      alert("請使用 Android Chrome 或 iPhone Safari 開啟，以支援語音功能！");
    }

    function speak(text, lang) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    }

    async function callWorkerTranslate(text, mode) {
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, mode })
        });
        const data = await res.json();
        if (data.error) {
          statusDiv.innerText = "錯誤: " + data.error;
          return null;
        }
        return data;
      } catch (e) {
        statusDiv.innerText = "連線失敗，請檢查網絡";
        return null;
      }
    }

    function handleMaster() {
      if (!recognizer) return;
      recognizer.lang = 'zh-HK';
      statusDiv.innerText = "🎧 師傅請講嘢...";
      recognizer.start();

      recognizer.onresult = async (event) => {
        const spoken = event.results[0][0].transcript;
        statusDiv.innerText = "⏳ 正在精準翻譯...";

        const result = await callWorkerTranslate(spoken, 'to_worker');

        if (result && result.en) {
          displayBox.innerHTML = 
            '<div class="text-original">師傅講：「' + spoken + '」</div>' +
            '<div class="text-main">🇺🇸 ' + result.en + '</div>' +
            '<div class="text-sub">🇵🇭 ' + (result.tl || '') + '</div>';
          statusDiv.innerText = "🔊 正在朗讀英文...";
          speak(result.en, 'en-US');
        }
      };

      recognizer.onerror = () => {
        statusDiv.innerText = "未聽清楚，請再撳一次！";
      };
    }

    function handleWorker() {
      if (!recognizer) return;
      recognizer.lang = 'en-US';
      statusDiv.innerText = "🎧 Listening to worker...";
      recognizer.start();

      recognizer.onresult = async (event) => {
        const spoken = event.results[0][0].transcript;
        statusDiv.innerText = "⏳ 翻譯緊廣東話...";

        const result = await callWorkerTranslate(spoken, 'to_canto');

        if (result && result.canto) {
          displayBox.innerHTML = 
            '<div class="text-original">姐姐講："' + spoken + '"</div>' +
            '<div class="text-main" style="color: #00d2ff;">廣東話：' + result.canto + '</div>';
          statusDiv.innerText = "🔊 正在朗讀廣東話...";
          speak(result.canto, 'zh-HK');
        }
      };

      recognizer.onerror = () => {
        statusDiv.innerText = "未聽清楚，請再撳一次！";
      };
    }
  </script>
</body>
</html>
