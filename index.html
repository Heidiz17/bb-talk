<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>湊孖女翻譯神器</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="湊孖女神器">
  <meta name="application-name" content="湊孖女神器">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a202c">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", sans-serif;
      background: #14171a;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 0;
    }
    .app-title {
      font-size: 24px;
      font-weight: 900;
      color: #ff80ab;
      letter-spacing: 1px;
    }

    #status {
      text-align: center;
      font-size: 15px;
      color: #b0bec5;
      font-weight: bold;
      min-height: 22px;
    }

    #display-box {
      flex: 1;
      background: #21262d;
      border: 2px solid #374151;
      border-radius: 20px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 12px;
    }
    .text-original { font-size: 16px; color: #9e9e9e; }
    .text-en { font-size: 26px; font-weight: bold; color: #00e676; line-height: 1.3; }
    .text-tl { font-size: 20px; color: #ffd54f; line-height: 1.3; }
    .text-canto { font-size: 26px; font-weight: bold; color: #40c4ff; line-height: 1.3; }

    .replay-btn {
      margin-top: 10px;
      background: #374151;
      border: 1px solid #4b5563;
      color: #fff;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .action-btn {
      width: 100%;
      height: 105px;
      border: none;
      border-radius: 20px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      cursor: pointer;
      touch-action: manipulation;
    }
    .action-btn:active { transform: scale(0.97); }

    .btn-master {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      font-size: 24px;
      font-weight: 900;
    }
    .btn-worker {
      background: linear-gradient(135deg, #1565c0, #0d47a1);
      font-size: 24px;
      font-weight: 900;
    }
    .btn-subtext { font-size: 14px; font-weight: normal; margin-top: 4px; opacity: 0.85; }
  </style>
</head>
<body>

  <div class="app-header">
    <span style="font-size: 24px;">👶👶🍼🍼</span>
    <span class="app-title">湊孖女翻譯神器</span>
  </div>

  <div id="status">準備就緒，點掣開始</div>

  <div id="display-box">
    <div style="font-size: 48px;">🍼</div>
    <div style="font-size: 20px; font-weight: bold;">點擊下方按鈕開始對話</div>
    <div style="font-size: 15px; color: #81c784;">🟢 師傅講廣東話 ➔ 自動讀出英文 + 菲律賓語</div>
    <div style="font-size: 15px; color: #64b5f6;">🔵 姐姐講英文 ➔ 自動讀出廣東話</div>
  </div>

  <div class="btn-container">
    <button class="action-btn btn-master" id="btn-master" onclick="handleMaster()">
      🟢 師傅講嘢 (我講)
      <span class="btn-subtext">講廣東話 ➔ 自動讀出英文+菲語</span>
    </button>

    <button class="action-btn btn-worker" id="btn-worker" onclick="handleWorker()">
      🔵 姐姐講嘢 (佢講)
      <span class="btn-subtext">Worker speaks ➔ 自動讀出廣東話</span>
    </button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    const WORKER_URL = "https://throbbing-thunder-3e04happy-baby-translator.stream-hub-th.workers.dev";

    const statusDiv = document.getElementById('status');
    const displayBox = document.getElementById('display-box');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null;

    if (SpeechRecognition) {
      recognizer = new SpeechRecognition();
      recognizer.continuous = false;
      recognizer.interimResults = false;
    }

    // 核心優化：iOS PWA 音效解鎖（必須在點擊瞬間執行）
    let audioCtx = null;
    function unlockIOSAudio() {
      // 1. 解鎖 Web Audio Context
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}

      // 2. 解鎖 SpeechSynthesis 引擎（播一個極短靜音）
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const silent = new SpeechSynthesisUtterance(' ');
        silent.volume = 0.01;
        silent.rate = 10;
        window.speechSynthesis.speak(silent);
      }
    }

    function speak(text, lang) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      utter.volume = 1.0;

      // 兼容 iOS 佇列卡住問題
      setTimeout(() => {
        window.speechSynthesis.speak(utter);
      }, 50);
    }

    async function callWorker(payload) {
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        return data;
      } catch (e) {
        statusDiv.innerText = "連線失敗: " + e.message;
        displayBox.innerHTML = '<div style="color: #ff5252; font-weight: bold;">連線出錯，請檢查網絡或 Worker！</div>';
        return null;
      }
    }

    // 師傅廣東話 ➔ 英文 + 菲律賓語
    function handleMaster() {
      unlockIOSAudio();

      if (!recognizer) {
        statusDiv.innerText = "⚠️ 此瀏覽器不支援語音識別";
        alert("此模式尚未支援語音辨識，請使用 Chrome 或更新 iOS 系統至最新版！");
        return;
      }

      recognizer.lang = 'zh-HK';
      statusDiv.innerText = "🎧 師傅請講廣東話...";
      
      try {
        recognizer.start();
      } catch (err) {
        // 防止連續點擊重複 start 報錯
        recognizer.stop();
        setTimeout(() => recognizer.start(), 150);
      }

      recognizer.onresult = async (event) => {
        const spoken = event.results[0][0].transcript;
        statusDiv.innerText = "⏳ 正在翻譯...";
        displayBox.innerHTML = '<div class="text-original">師傅講：「' + spoken + '」</div><div style="color: #ffeb3b; margin-top: 10px;">⏳ 正在呼叫 AI 翻譯...</div>';

        const result = await callWorker({ text: spoken, mode: "to_worker" });

        if (result && result.error) {
          statusDiv.innerText = "出錯: " + result.error;
          displayBox.innerHTML += '<div style="color: #ff5252; margin-top: 8px;">後台錯誤: ' + result.error + '</div>';
          return;
        }

        if (result && result.en) {
          const safeEn = encodeURIComponent(result.en);
          displayBox.innerHTML = 
            '<div class="text-original">師傅講：「' + spoken + '」</div>' +
            '<div class="text-en">🇺🇸 ' + result.en + '</div>' +
            '<div class="text-tl">🇵🇭 ' + (result.tl || '') + '</div>' +
            '<button class="replay-btn" onclick="speak(decodeURIComponent(\'' + safeEn + '\'), \'en-US\')">🔊 重播英文</button>';
          statusDiv.innerText = "🔊 正在朗讀英文...";
          speak(result.en, 'en-US');
        } else {
          statusDiv.innerText = "未收到有效翻譯結果";
        }
      };

      recognizer.onerror = (e) => { 
        statusDiv.innerText = "語音識別未收到，請再試！"; 
      };
    }

    // 姐姐英文 ➔ 廣東話
    function handleWorker() {
      unlockIOSAudio();

      if (!recognizer) {
        statusDiv.innerText = "⚠️ This browser does not support Speech Recognition";
        alert("Speech Recognition not supported in this mode. Please use Chrome!");
        return;
      }

      recognizer.lang = 'en-US';
      statusDiv.innerText = "🎧 Please speak English...";
      
      try {
        recognizer.start();
      } catch (err) {
        recognizer.stop();
        setTimeout(() => recognizer.start(), 150);
      }

      recognizer.onresult = async (event) => {
        const spoken = event.results[0][0].transcript;
        statusDiv.innerText = "⏳ 翻譯緊廣東話...";
        displayBox.innerHTML = '<div class="text-original">Worker: "' + spoken + '"</div><div style="color: #ffeb3b; margin-top: 10px;">⏳ 正在呼叫 AI 翻譯...</div>';

        const result = await callWorker({ text: spoken, mode: "to_canto" });

        if (result && result.error) {
          statusDiv.innerText = "出錯: " + result.error;
          displayBox.innerHTML += '<div style="color: #ff5252; margin-top: 8px;">後台錯誤: ' + result.error + '</div>';
          return;
        }

        if (result && result.canto) {
          const safeCanto = encodeURIComponent(result.canto);
          displayBox.innerHTML = 
            '<div class="text-original">Worker: "' + spoken + '"</div>' +
            '<div class="text-canto">廣東話：' + result.canto + '</div>' +
            '<button class="replay-btn" onclick="speak(decodeURIComponent(\'' + safeCanto + '\'), \'zh-HK\')">🔊 重播廣東話</button>';
          statusDiv.innerText = "🔊 正在朗讀廣東話...";
          speak(result.canto, 'zh-HK');
        } else {
          statusDiv.innerText = "未收到有效翻譯結果";
        }
      };

      recognizer.onerror = (e) => { 
        statusDiv.innerText = "Could not hear, please try again!"; 
      };
    }
  </script>
</body>
</html>
